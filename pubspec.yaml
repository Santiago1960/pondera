name: pondera
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  cryptography: ^2.9.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_libserialport: ^0.6.0
  flutter_secure_storage: ^10.3.1
  http: ^1.6.0
  package_info_plus: ^10.1.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  image_path: "assets/branding/pondera_logo.png"
  android: false
  ios: false
  macos:
    generate: true
    image_path: "assets/branding/pondera_logo.png"
  windows:
    generate: true
    image_path: "assets/branding/pondera_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/branding/pondera_logo.png
    - assets/help/pondera_manual_usuario.pdf
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
